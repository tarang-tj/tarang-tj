name: add a failing test case
description: ask something the retrieval harness cannot cover from data/facts.md. if it cannot, that is a failing test.
title: "stump: "
labels: ["trial"]
body:
  - type: markdown
    attributes:
      value: |
        the harness ranks [`data/facts.md`](https://github.com/tarang-tj/tarang-tj/blob/main/data/facts.md) against your question and answers only from what it retrieves. no tools, no web access, no guessing.

        **it retrieves something** → the trial is logged as *held*.
        **it retrieves nothing** → that is a failing test, your handle goes on the board, and the gap
        stays listed on the profile until tj writes the missing fact.

        either way the result is committed to the README within about a minute.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: one question scores better than five. specific beats broad.
      placeholder: what does ragproof actually measure?
    validations:
      required: true
