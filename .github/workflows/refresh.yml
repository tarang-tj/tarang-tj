name: refresh profile

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.tmpl.md"
      - "scripts/**"
      - "data/facts.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Runs first: a gap the corpus now covers gets announced and its issue
      # closed before the rebuild drops it off the open list.
      - name: Announce and close covered gaps
        env:
          APPLY: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/close-gaps.mjs

      # Runs before the rebuild so the day's coverage figure is already on disk
      # when the panel is drawn. Pure retrieval over local files: no model, no
      # network, so it cannot fail the job for someone else's outage.
      - name: Run the self-test suite
        run: node scripts/run-selftest.mjs

      - name: Rebuild README and hero panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero.svg data/stats.json data/eval.json data/history.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh profile stats"
          git push
