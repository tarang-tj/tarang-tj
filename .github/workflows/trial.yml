name: run trial

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  trial:
    # Only questions, only humans.
    if: >
      github.event.issue.user.type != 'Bot' &&
      (contains(github.event.issue.labels.*.name, 'trial') ||
       startsWith(github.event.issue.title, 'stump:') ||
       startsWith(github.event.issue.title, 'ask:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Public repo, public trigger: cap how many trials run per day so a burst
      # cannot exhaust the free-tier rate limit.
      - name: Daily budget guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api -X GET search/issues \
            -f q="repo:${{ github.repository }} is:issue created:>=$since" \
            --jq '.total_count')
          echo "trials in the last 24h: $count"
          if [ "$count" -gt 40 ]; then
            echo "::warning::daily trial budget reached; skipping"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Run the trial
        if: env.SKIP != '1'
        env:
          # Optional. No secret means the trial answers by retrieval, which is
          # the same code path the fallback uses, so nothing here can break it.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional repo variable. Unset or empty falls back to the default
          # model in scripts/run-trial.mjs, so the model can change without
          # editing this workflow.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/run-trial.mjs

      - name: Commit the scoreboard
        if: env.SKIP != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-dark.svg assets/hero-light.svg data/eval.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "eval: log trial #${{ github.event.issue.number }}"
          git push
