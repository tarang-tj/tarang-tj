<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="A terminal running a verification of Tarang Jammalamadaka's projects, 2026-09-01. 3 systems shipped and tested, 80 tests passing. ragproof, ok, NDCG@10 0.72 vs 0.56 BM25 on BEIR/scifact. claude-skill-audit, ok, 37 checks, 6 rule modules, 0 dependencies. starship-flow-control, ok, multi-level BOM constraint model, live demo. the-breaker, in progress, design done, hardware not built yet. this profile, in progress, 88% self-test coverage (16/18). no stranger has tried to break it yet. the invitation is open.">
<defs>
  <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
  </radialGradient>
  <filter id="ph" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.1" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="0.85" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1.2" fill="#000" opacity="0.34"/>
  </pattern>
</defs>
  <rect width="880" height="414" rx="12" fill="#050A07"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="36" y="62" fill="#3FE08A" filter="url(#ph)">tj@bothell</text><text x="128" y="62" fill="#2E6E4E">:~$</text><text x="164" y="62" fill="#D6F5E4" filter="url(#soft)">./verify --all</text>
    <text x="36" y="92" fill="#2E6E4E">running 5 systems, 80 assertions, every figure checked into something you can run</text>

  <text x="36" y="126" fill="#3FE08A" filter="url(#ph)"> ok </text>
  <text x="94" y="126" fill="#D6F5E4">ragproof</text>
  <text x="304" y="126" fill="#5E8C74">NDCG@10 0.72 vs 0.56 BM25 on BEIR/scifact</text>
  <text x="844" y="126" fill="#2E6E4E" text-anchor="end">54</text>
  <text x="36" y="154" fill="#3FE08A" filter="url(#ph)"> ok </text>
  <text x="94" y="154" fill="#D6F5E4">claude-skill-audit</text>
  <text x="304" y="154" fill="#5E8C74">37 checks, 6 rule modules, 0 dependencies</text>
  <text x="844" y="154" fill="#2E6E4E" text-anchor="end">6</text>
  <text x="36" y="182" fill="#3FE08A" filter="url(#ph)"> ok </text>
  <text x="94" y="182" fill="#D6F5E4">starship-flow-control</text>
  <text x="304" y="182" fill="#5E8C74">multi-level BOM constraint model, live demo</text>
  <text x="844" y="182" fill="#2E6E4E" text-anchor="end">20</text>
  <text x="36" y="210" fill="#E0A63F" filter="url(#ph)">wip </text>
  <text x="94" y="210" fill="#D6F5E4">the-breaker</text>
  <text x="304" y="210" fill="#5E8C74">design done, hardware not built yet</text>
  <text x="844" y="210" fill="#2E6E4E" text-anchor="end"></text>
  <text x="36" y="238" fill="#E0A63F" filter="url(#ph)">wip </text>
  <text x="94" y="238" fill="#D6F5E4">this profile</text>
  <text x="304" y="238" fill="#5E8C74">88% self-test coverage (16/18)</text>
  <text x="844" y="238" fill="#2E6E4E" text-anchor="end"></text>
    <line x1="36" y1="272" x2="844" y2="272" stroke="#2E6E4E" stroke-opacity="0.45"/>
    <text x="36" y="302" fill="#D6F5E4" font-size="17" filter="url(#soft)">3 shipped · 80 passing · 0 claims without evidence</text>
    <text x="36" y="326" fill="#5E8C74">no stranger has tried to break it yet. the invitation is open.</text>
    <text x="36" y="346" fill="#2E6E4E">29 public repos · python · typescript · javascript · c++</text>
    <text x="36" y="384" fill="#3FE08A" filter="url(#ph)">tj@bothell</text><text x="128" y="384" fill="#2E6E4E">:~$</text>
    <rect x="166" y="372" width="9" height="16" fill="#3FE08A" filter="url(#ph)"/>
  </g>

  <rect width="880" height="414" fill="url(#scan)"/>
  <rect width="880" height="414" filter="url(#grain)" opacity="0.5"/>
  <rect width="880" height="414" rx="12" fill="url(#vig)"/>
</svg>
