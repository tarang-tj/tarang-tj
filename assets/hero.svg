<text class="stat" x="32" y="270"><tspan class="figure">14</tspan> of <tspan class="figure">18</tspan> suite questions covered<tspan class="sep">  ·  </tspan><tspan class="fig-amber">4</tspan> uncovered<tspan class="sep">  ·  </tspan>drift <tspan class="figure">0 pts</tspan> over 5 readings</text>
