<path class="area" d="M68 137.6 L263 137.6 L458 137.6 L653 137.6 L848 137.6 L848 206 L68 206 Z"/><path class="line" d="M68 137.6 L263 137.6 L458 137.6 L653 137.6 L848 137.6"/><circle class="dot" cx="68" cy="137.6" r="2"/><circle class="dot" cx="263" cy="137.6" r="2"/><circle class="dot" cx="458" cy="137.6" r="2"/><circle class="dot" cx="653" cy="137.6" r="2"/><circle class="head-halo" cx="848" cy="137.6" r="5.5"/><circle class="head" cx="848" cy="137.6" r="3"/>

