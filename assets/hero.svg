<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 374" width="880" height="374" role="img" aria-label="Suite coverage 77%, traced over 5 daily readings from 77%. 0 questions asked of this profile's grounded bot, 0 answered and 0 unanswered, no model-written answer has been scored yet.">
<defs>
  <linearGradient id="hero-fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FD1A8" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#7FD1A8" stop-opacity="0.02"/>
  </linearGradient>
  <linearGradient id="hero-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7FD1A8" stop-opacity="0"/>
    <stop offset="1" stop-color="#7FD1A8" stop-opacity="0.13"/>
  </linearGradient>
  <clipPath id="hero-plot">
    <rect x="68" y="118" width="780" height="101"/>
  </clipPath>
</defs>
<style>
  .panel { fill: #121821; stroke: #263041; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .eyebrow { fill: #F2A65A; font-size: 12px; letter-spacing: 2.6px; }
  .stamp { fill: #8B98A9; font-size: 12px; }
  .rate { fill: #E6EDF3; font-size: 26px; font-weight: 600; }
  .rate-label { fill: #8B98A9; font-size: 14px; }
  .stat { fill: #8B98A9; font-size: 13.5px; }
  .figure { fill: #7FD1A8; font-weight: 600; }
  .fig-amber { fill: #F2A65A; font-weight: 600; }
  .sep { fill: #1E2836; }
  .note { fill: #8B98A9; font-size: 12px; }
  .rule { stroke: #1E2836; stroke-width: 1; }
  .grid { stroke: #1B2430; stroke-width: 1; }
  .ref { stroke: #1E2836; stroke-width: 1; stroke-dasharray: 3 5; }
  .axis-line { stroke: #263041; stroke-width: 1; }
  .axis { fill: #8B98A9; font-size: 10.5px; opacity: 0.8; }
  .tick-key { fill: #F2A65A; font-weight: 700; }
  .empty { fill: #8B98A9; font-size: 13px; }
  .area { fill: url(#hero-fill); }
  .line { fill: none; stroke: #7FD1A8; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .lone { stroke: #7FD1A8; stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0.55; }
  .dot { fill: #7FD1A8; opacity: 0.65; }
  .head { fill: #7FD1A8; }
  .head-halo { fill: #7FD1A8; opacity: 0.2; }
  .tick { stroke: #F2A65A; stroke-width: 1.6; opacity: 0.9; }
  /* GitHub serves this file as image/svg+xml with the stylesheet intact, so CSS
     animation does play in a browser. It is still written so that every element's
     RESTING state is the finished state: no real content animates in from opacity
     0, and the one moving part is a decorative overlay that is invisible at frame
     0. A still frame of this panel is the complete chart, which keeps it correct
     anywhere the SVG gets rasterised (link previews, screenshots, crawlers). The
     sweep is a scope line travelling across the trace and nothing else moves. */
  .sweep { animation: sweep 7s linear infinite; }
  @keyframes sweep {
    0% { transform: translateX(0); opacity: 0; }
    6% { opacity: 0.85; }
    62% { opacity: 0.85; }
    70% { transform: translateX(780px); opacity: 0; }
    100% { transform: translateX(780px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sweep { animation: none; }
  }
</style>
